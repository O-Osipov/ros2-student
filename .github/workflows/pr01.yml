name: PR01 — проверка отчёта

on: [push, pull_request]

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w03-7fbfd3e8161a.tar.gz
      COURSE_KIT_SHA256: 7fbfd3e8161ab6c6ebefc7663efdaf77d9a7d490399743507f33dcefbd5ac522
    steps:
      - name: Получить всю историю коммитов
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Скачать зафиксированный комплект курса
        shell: bash
        run: |
          curl -fsSLo course-kit.tar.gz "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" course-kit.tar.gz | sha256sum -c -
          mkdir -p .course-kit
          tar -xzf course-kit.tar.gz -C .course-kit
      - name: Проверить JSON и совпадение версии архива
        shell: bash
        run: |
          python3 -m json.tool evidence/pr01/environment.json > /dev/null
          python3 -m json.tool evidence/pr01/report.json > /dev/null
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path('evidence/pr01/report.json').read_text())
          if report['course_kit']['archive_sha256'] != os.environ['COURSE_KIT_SHA256']:
              raise SystemExit('SHA-256 комплекта в отчёте отличается от архива CI')
          version = Path('.course-kit/v1/VERSION').read_text().strip()
          if report['course_kit']['version'] != version:
              raise SystemExit('Версия комплекта в отчёте отличается от архива CI')
          PYTHON
      - name: Проверить комплектность evidence и коммит реализации
        shell: bash
        run: python3 .course-kit/v1/tools/check_practice.py PR01 --submission .
