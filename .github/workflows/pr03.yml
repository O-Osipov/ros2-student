name: PR03 — patrol, turtlesim и отчёт

on:
  push:
    branches: [pr03]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  practice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: osrf/ros:lyrical-desktop-full@sha256:e6b1cb530b65588279681db53784e264ce5cf83f2cc33e689d27d6024d7f3ebe
      options: --user 0
    env:
      ROS_DOMAIN_ID: '47'
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      QT_QPA_PLATFORM: offscreen
      COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w03-7fbfd3e8161a.tar.gz
      COURSE_KIT_SHA256: 7fbfd3e8161ab6c6ebefc7663efdaf77d9a7d490399743507f33dcefbd5ac522
    steps:
      - name: Подготовить Node.js для checkout в контейнере
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends nodejs
          node -e 'if (Number(process.versions.node.split(".")[0]) < 20) process.exit(1)'
      - name: Получить всю историю
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Собрать пакеты и проверить ROS
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/lyrical/setup.bash
          colcon build --symlink-install --packages-select turtle_bringup patrol
          source install/setup.bash
          test -f "$(ros2 pkg prefix turtle_bringup)/share/turtle_bringup/launch/sim.launch.py"
          python3 -m py_compile src/turtle_bringup/launch/sim.launch.py
          (cd src/turtle_bringup && python3 -m pytest -q test)
          python3 -m pytest -q src/patrol/test scripts/test_check_pr03.py
          python3 scripts/check_pr03.py
      - name: Скачать и сверить комплект курса
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo course-kit.tar.gz "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" course-kit.tar.gz | sha256sum -c -
          mkdir -p .course-kit/pr03
          tar -xzf course-kit.tar.gz -C .course-kit/pr03
      - name: Проверить отчёт ПР03
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool evidence/pr03/report.json > /dev/null
          python3 .course-kit/pr03/v1/tools/check_practice.py PR03 --submission .
