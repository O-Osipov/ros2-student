name: PR04 — параметры patrol и проверка отчёта

on:
  push:
    branches: [pr04]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  practice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: osrf/ros:lyrical-desktop-full@sha256:e6b1cb530b65588279681db53784e264ce5cf83f2cc33e689d27d6024d7f3ebe
      options: --user 0
    env:
      ROS_DOMAIN_ID: '48'
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      QT_QPA_PLATFORM: offscreen
      COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w07-001f7ec79674.tar.gz
      COURSE_KIT_SHA256: 001f7ec79674d09a0f7eff2ad0935f58c95101b0cf200425c368f41579d6a31c
    steps:
      - name: Подготовить Node.js для checkout в ROS-контейнере
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends nodejs
          node -e 'if (Number(process.versions.node.split(".")[0]) < 20) process.exit(1)'
      - name: Получить всю историю коммитов
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Собрать пакеты и проверить поведение ПР04
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/lyrical/setup.bash
          colcon build --symlink-install --packages-select turtle_bringup patrol
          source install/setup.bash
          test -f "$(ros2 pkg prefix turtle_bringup)/share/turtle_bringup/launch/sim.launch.py"
          python3 -m pytest -q src/patrol/test scripts/test_check_pr03.py
          python3 scripts/check_pr04.py
      - name: Скачать и сверить course kit
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo course-kit.tar.gz "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" course-kit.tar.gz | sha256sum -c -
          mkdir -p .course-kit/pr04
          tar -xzf course-kit.tar.gz -C .course-kit/pr04
      - name: Проверить отчёт ПР04
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool evidence/pr04/report.json > /dev/null
          python3 .course-kit/pr04/v1/tools/check_practice.py PR04 --submission .
