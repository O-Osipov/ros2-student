name: PR02 — сборка пакета и проверка отчёта

on:
  push:
    branches: [pr02]

permissions:
  contents: read

jobs:
  practice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: osrf/ros:lyrical-desktop-full@sha256:e6b1cb530b65588279681db53784e264ce5cf83f2cc33e689d27d6024d7f3ebe
      options: --user 0
    env:
      COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w03-7fbfd3e8161a.tar.gz
      COURSE_KIT_SHA256: 7fbfd3e8161ab6c6ebefc7663efdaf77d9a7d490399743507f33dcefbd5ac522
    steps:
      - name: Подготовить Node для checkout в контейнере
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends nodejs
          node -e 'if (Number(process.versions.node.split(".")[0]) < 20) process.exit(1)'
      - name: Получить всю историю коммитов
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Собрать пакет и проверить установленный launch
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/lyrical/setup.bash
          colcon build --symlink-install --packages-select turtle_bringup
          source install/setup.bash
          test -f "$(ros2 pkg prefix turtle_bringup)/share/turtle_bringup/launch/sim.launch.py"
          python3 -m py_compile src/turtle_bringup/launch/sim.launch.py
      - name: Скачать зафиксированный комплект курса
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo course-kit.tar.gz "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" course-kit.tar.gz | sha256sum -c -
          mkdir -p .course-kit
          tar -xzf course-kit.tar.gz -C .course-kit
      - name: Проверить отчёт и комплектность evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool evidence/pr02/report.json > /dev/null
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path('evidence/pr02/report.json').read_text())
          assert report['course_kit']['archive_sha256'] == os.environ['COURSE_KIT_SHA256']
          assert report['course_kit']['version'] == Path('.course-kit/v1/VERSION').read_text().strip()
          PYTHON
          python3 .course-kit/v1/tools/check_practice.py PR02 --submission .
