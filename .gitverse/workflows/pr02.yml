name: PR02 — сборка пакета и проверка отчёта

on: [push, pull_request]

jobs:
  practice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: osrf/ros:lyrical-desktop-full@sha256:e6b1cb530b65588279681db53784e264ce5cf83f2cc33e689d27d6024d7f3ebe
      options: --user 0
    env:
      COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w02-5d210c431e32.tar.gz
      COURSE_KIT_SHA256: 5d210c431e32418f45e2cffa9dd2028116c7a9520a36f3c7079c778cd73437a8
    steps:
      # GitVerse запускает JavaScript actions через node внутри job-контейнера.
      # ROS-образ не содержит Node; он нужен и для main, и для post checkout.
      - name: Подготовить Node для checkout и его завершающего шага
        shell: bash
        run: |
          test "$(id -u)" -eq 0
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends nodejs
          node --version
          node -e 'if (Number(process.versions.node.split(".")[0]) < 20) process.exit(1)'
      - name: Получить всю историю коммитов
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Собрать пакет и проверить установленный launch
        shell: bash
        run: |
          source /opt/ros/lyrical/setup.bash
          colcon build --symlink-install --packages-select turtle_bringup
          source install/setup.bash
          test -f "$(ros2 pkg prefix turtle_bringup)/share/turtle_bringup/launch/sim.launch.py"
          python3 -m py_compile src/turtle_bringup/launch/sim.launch.py
          (cd src/turtle_bringup && python3 -m pytest test -q)
      - name: Скачать зафиксированный комплект курса
        shell: bash
        run: |
          curl -fsSLo course-kit.tar.gz "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" course-kit.tar.gz | sha256sum -c -
          mkdir -p .course-kit/pr02
          tar -xzf course-kit.tar.gz -C .course-kit/pr02
      - name: Проверить версию архива и контракт evidence
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path('evidence/pr02/report.json').read_text())
          assert report['course_kit']['version'] == 'v1-w02'
          assert report['course_kit']['archive_sha256'] == os.environ['COURSE_KIT_SHA256']
          PYTHON
          python3 .course-kit/pr02/v1/tools/check_practice.py PR02 --submission .
